<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Jersey E-Commerce</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" type="text/tailwindcss" href="css/style.css" />
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #111827; /* Warna gelap */
        --color-primary-dark: #000000; /* Warna hitam murni */
        --color-secondary: #10b981; /* Warna  hijau lapangan */
        --color-secondary-dark: #059669; /* Warna hijau saat di-hover */
        --color-accent: #f59e0b; /* Warna Emas */
        --color-surface: #f8fafc; /* Warna latar belakang putih */
      }
    </style>
  </head>
  <body class="bg-surface">
    <!-- sidenav -->
    <aside class="fixed top-0 left-0 z-40 hidden md:flex flex-col bg-primary px-4 py-2 border gap-2 w-48 h-svh">
      <h1 class="text-3xl font-bold text-surface mb-8">Jersey<span class="text-accent">Hub</span></h1>
      <a href="/dashboard" class="text-surface hover:text-gray-200 font-bold">Dashboard</a>
      <a href="/" class="text-red-400 hover:text-red-600 font-bold">Keluar</a>
    </aside>
    <nav class="md:hidden flex justify-center items-center bg-primary px-4 py-2 gap-4">
      <a href="/dashboard" class="text-surface hover:text-gray-200 font-bold">Dashboard</a>
      <a href="/" class="text-red-400 hover:text-red-600 font-bold">Keluar</a>
    </nav>
    <!-- Main -->
    <section class="md:ml-48 p-8">
      <h3 class="text-2xl font-bold">Dashboard</h3>
      <p class="text-gray-600 text-sm mb-8">Kotak masuk</p>

      <div class="bg-white shadow-lg rounded-xl overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-gray-100 text-gray-700">
            <tr>
              <th class="p-4 font-semibold">Nama Pengirim</th>
              <th class="p-4 font-semibold">Email</th>
              <th class="p-4 font-semibold">Judul Pesan</th>
              <th class="p-4 font-semibold">Isi Pesan</th>
            </tr>
          </thead>
          <tbody id="contact" class="divide-y divide-gray-200">
            <!-- Hasil JS -->
          </tbody>
        </table>
      </div>
    </section>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
