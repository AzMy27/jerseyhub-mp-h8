<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Jersey E-Commerce</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" type="text/tailwindcss" href="css/style.css" />
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #111827; /* Warna gelap */
        --color-primary-dark: #000000; /* Warna hitam murni */
        --color-secondary: #10b981; /* Warna  hijau lapangan */
        --color-secondary-dark: #059669; /* Warna hijau saat di-hover */
        --color-accent: #f59e0b; /* Warna Emas */
        --color-surface: #f8fafc; /* Warna latar belakang putih */
      }
    </style>
  </head>
  <body class="bg-surface">
    <!-- Main -->
    <a
      href="/index.html"
      class="absolute top-8 left-8 text-gray-500 hover:text-primary font-semibold flex items-center gap-2 transition-colors"
    >
      Kembali
    </a>
    <div class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 min-h-screen">
      <div class="w-full bg-white p-8 rounded-xl shadow-xl border-accent max-w-md">
        <div class="text-center mb-8">
          <h2 class="text-2xl font-bold">Selamat Datang</h2>
        </div>
        <form class="space-y-6" id="login">
          <div class="">
            <label class="text-xl font-semibold mb-4">Email<span class="text-red-600">*</span></label>
            <div class="flex flex-row gap-4 mb-4 items-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-mail"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" />
                <path d="M3 7l9 6l9 -6" />
              </svg>
              <input
                type="email"
                id="email"
                class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50 transition-colors"
                placeholder="Email"
              />
            </div>
            <label class="text-xl font-semibold mb-4">Password<span class="text-red-600">*</span></label>
            <div class="flex flex-row gap-4 mb-4 items-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-lock"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
                <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
                <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
              </svg>
              <input
                type="password"
                id="password"
                class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50 transition-colors"
                placeholder="Password"
              />
            </div>
            <button
              type="submit"
              class="bg-primary hover:bg-primary-dark text-surface font-bold px-3 py-2 rounded-lg w-full mb-2 transition-colors duration-300"
            >
              Login
            </button>
            <p class="text-sm text-red-600" id="message"></p>
          </div>
        </form>
        <a href="/register.html" class="text-sm text-gray-700"
          >Dont have an account? <span class="text-blue-600 text-sm">Sign up</span></a
        >
      </div>
    </div>
    <script src="/js/login.js"></script>
  </body>
</html>
