<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jersey E-Commerce</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" type="text/tailwindcss" href="css/style.css" />
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #111827; /* Warna gelap */
        --color-primary-dark: #000000; /* Warna hitam murni */
        --color-secondary: #10b981; /* Warna  hijau lapangan */
        --color-secondary-dark: #059669; /* Warna hijau saat di-hover */
        --color-accent: #f59e0b; /* Warna Emas */
        --color-surface: #f8fafc; /* Warna latar belakang putih */
      }
    </style>
  </head>
  <body class="bg-surface">
    <!-- Navbar -->
    <div class="flex justify-between items-center gap-8 px-4 py-3 shadow-lg bg-primary-dark">
      <a href="/" class="flex">
        <h2 class="text-surface text-2xl font-bold tracking-wider">Jersey<span class="text-accent">Hub</span></h2>
      </a>
      <nav
        class="flex flex-wrap justify-center items-center gap-4 md:gap-8 text-sm md:text-base hidden md:flex"
        id="myLinks"
      >
        <a href="/" class="text-surface hover:text-secondary-dark transition-colors">Home</a>
        <a href="/products" class="text-surface hover:text-secondary-dark transition-colors">Produk</a>
        <a href="/gallery" class="text-surface hover:text-secondary-dark transition-colors">Galeri</a>
        <a href="/about-us" class="text-surface hover:text-secondary-dark transition-colors">Tentang Kami</a>
        <a href="/contact" class="text-surface hover:text-secondary-dark transition-colors">Kontak</a>
        <a href="/login" class="text-surface hover:text-secondary-dark transition-colors">Login</a>
      </nav>
      <a href="javascript:void(0);" class="flex block md:hidden" onclick="myFunction()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2 text-surface"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M4 6l16 0" />
          <path d="M4 12l16 0" />
          <path d="M4 18l16 0" />
        </svg>
      </a>
    </div>
    <!-- Main -->
    <section class="px-8 py-12 min-h-screen">
      <h1 class="text-center font-bold text-3xl text-primary mb-12 leading-tight">Hubungi Kami</h1>
      <form class="flex items-center justify-center" id="contact">
        <div class="w-full max-w-xl">
          <p class="text-xl font-semibold mb-4">Nama<span class="text-red-600">*</span></p>
          <div class="flex flex-row gap-12 mb-8">
            <input
              type="text"
              id="first-name"
              class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50"
              placeholder="First Name"
              required
            />
            <input
              type="text"
              id="last-name"
              class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50"
              placeholder="First Last"
              required
            />
          </div>
          <p class="text-xl font-semibold mb-4">Email<span class="text-red-600">*</span></p>
          <div class="flex flex-row gap-12 mb-8">
            <input
              type="email"
              id="email"
              class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50"
              placeholder="Email"
              required
            />
          </div>
          <p class="text-xl font-semibold mb-4">No. Hp<span class="text-red-600">*</span></p>
          <div class="flex flex-row gap-12 mb-8">
            <input
              type="number"
              id="phone"
              class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50"
              placeholder="No. Hp"
              required
            />
          </div>
          <p class="text-xl font-semibold mb-4">Judul Pesan<span class="text-red-600">*</span></p>
          <div class="flex flex-row gap-12 mb-8">
            <input
              type="text"
              id="message-title"
              class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50"
              placeholder="Judul pesan"
              required
            />
          </div>
          <p class="text-xl font-semibold mb-4">Pesan<span class="text-red-600">*</span></p>
          <div class="flex flex-row gap-12 mb-8">
            <textarea
              id="message-desc"
              class="px-4 py-2 rounded-lg shadow-lg w-full focus:outline-none focus:ring-2 focus:ring-secondary/50"
              placeholder="Deskripsi Pesan"
              rows="5"
              required
            ></textarea>
          </div>
          <button
            type="submit"
            class="bg-primary hover:bg-primary-dark text-white font-bold py-2 px-4 rounded-lg shadow-lg w-full mt-4"
          >
            Kirim Pesan
          </button>
        </div>
      </form>
    </section>

    <!-- Footer -->
    <footer class="bg-primary-dark text-surface pt-12 pb-6 mt-16 border-t-4 border-accent">
      <div class="flex flex-col md:flex-row justify-between items-start mb-8 px-8">
        <!-- bagian kiri -->
        <div class="flex flex-col max-w-sm">
          <div class="flex items-center gap-2 mb-4">
            <a href="/" class="flex">
              <h2 class="text-surface text-2xl font-bold tracking-wider">Jersey<span class="text-accent">Hub</span></h2>
            </a>
            <!-- <img src="assets/psg-logo.png" alt="Logo PSG" class="h-10 w-10 object-contain" /> -->
            <!-- <h2 class="text-2xl font-bold tracking-widest text-white">PSG <span class="text-accent">Store</span></h2> -->
          </div>
          <p class="text-gray-300 text-sm leading-relaxed">Penjelasan dalam footer</p>
        </div>
        <!-- bagian kanan -->
        <div class="mt-8 md:mt-0">
          <h3 class="text-lg font-bold text-white mb-4">Tautan Cepat</h3>
          <div class="flex flex-col gap-2">
            <a href="/products" class="text-surface hover:text-secondary-dark transition-colors">Produk</a>
            <a href="/gallery" class="text-surface hover:text-secondary-dark transition-colors">Galeri</a>
            <a href="/about-us" class="text-surface hover:text-secondary-dark transition-colors">Tentang Kami</a>
            <a href="/contact" class="text-surface hover:text-secondary-dark transition-colors">Kontak</a>
          </div>
        </div>
      </div>
      <div class="mx-8 pt-4 text-center text-xs border-t border-gray-600 text-gray-400">
        &copy; Dibuat oleh Muhammad Azmi
      </div>
    </footer>
    <script src="/js/script.js"></script>
    <script src="/js/contact.js"></script>
  </body>
</html>
